<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actividad del Reloj</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e9fbff, #fff7dc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      background: white;
      width: 90%;
      max-width: 900px;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      color: #06295c;
      font-size: 42px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #1597a5;
      font-size: 20px;
      margin-bottom: 25px;
    }

    .game {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .clock {
      width: 300px;
      height: 300px;
      border: 12px solid #06295c;
      border-radius: 50%;
      position: relative;
      background: #fff;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
    }

    .number {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ffd44d;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #06295c;
      transform: translate(-50%, -50%);
    }

    .hand {
      position: absolute;
      width: 6px;
      height: 105px;
      background: #06295c;
      left: 50%;
      top: 50%;
      transform-origin: bottom center;
      transform: translate(-50%, -100%) rotate(0deg);
      border-radius: 10px;
      transition: transform 2s ease-out;
    }

    .center {
      position: absolute;
      width: 22px;
      height: 22px;
      background: #06295c;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .panel {
      max-width: 380px;
    }

    .question-box {
      background: #f3fbff;
      border: 3px dashed #1597a5;
      border-radius: 18px;
      padding: 25px;
      min-height: 130px;
      font-size: 22px;
      color: #06295c;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      margin-top: 25px;
      background: #ffcc33;
      color: #06295c;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      background: #ffc107;
    }

    .selected {
      background: #ff6f61 !important;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Actividad del Reloj</h1>
    <p class="subtitle">Cada número, una historia para compartir</p>

    <div class="game">
      <div class="clock" id="clock">
        <div class="hand" id="hand"></div>
        <div class="center"></div>
      </div>

      <div class="panel">
        <div class="question-box" id="question">
          Presiona el botón para iniciar el juego.
        </div>

        <button onclick="spinClock()">Girar reloj</button>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      "Película favorita",
      "Segundo nombre",
      "Color favorito",
      "Comida favorita",
      "Mayor virtud",
      "Momento feliz",
      "Mayor sueño por alcanzar",
      "Momento más difícil dentro de tu equipo",
      "¿Por qué te integraste al equipo?",
      "¿A quién admiras en el equipo y por qué?",
      "¿Cuál es tu principal meta a lograr con este equipo?",
      "¿Cuáles son tus estrategias para mantenerte firme en los objetivos del equipo?"
    ];

    const clock = document.getElementById("clock");
    const hand = document.getElementById("hand");
    const questionBox = document.getElementById("question");

    const colors = [
      "#ffd44d", "#ff6f61", "#49c5c9", "#a58bd3",
      "#ffd44d", "#49c5c9", "#ff6f61", "#a58bd3",
      "#49c5c9", "#ffd44d", "#a58bd3", "#5db7e8"
    ];

    for (let i = 1; i <= 12; i++) {
      const angle = (i * 30 - 90) * Math.PI / 180;
      const radius = 120;
      const x = 150 + radius * Math.cos(angle);
      const y = 150 + radius * Math.sin(angle);

      const number = document.createElement("div");
      number.className = "number";
      number.id = "num" + i;
      number.textContent = i;
      number.style.left = x + "px";
      number.style.top = y + "px";
      number.style.background = colors[i - 1];

      clock.appendChild(number);
    }

    let currentRotation = 0;

    function spinClock() {
      document.querySelectorAll(".number").forEach(n => {
        n.classList.remove("selected");
      });

      const selected = Math.floor(Math.random() * 12) + 1;
      const finalAngle = selected * 30;

      currentRotation += 1080 + finalAngle;

      hand.style.transform = `translate(-50%, -100%) rotate(${currentRotation}deg)`;

      questionBox.textContent = "Girando...";

      setTimeout(() => {
        document.getElementById("num" + selected).classList.add("selected");
        questionBox.textContent = questions[selected - 1];
      }, 2000);
    }
  </script>

</body>
</html>
